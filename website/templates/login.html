<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Login | HYG Marketing Department Database</title>

  <meta name="application-name" content="HYG Marketing">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HYG Marketing">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">

  <!-- Decorative Background Elements -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>

  <div class="w-full max-w-md z-10">

    <!-- Login Card -->
    <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 p-8 md:p-10 border border-slate-100">
      <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-6">
        <div class="mb-2 flex flex-col items-center gap-3">
          <img src="{{ static_url('img/hyg-logo.png') }}" alt="HYG Group of Companies" class="w-44 h-auto bg-slate-900 rounded-2xl px-4 py-3">
        </div>
        <div class="mb-6">
          <h2 class="text-xl font-bold text-center text-slate-900 tracking-tight">HYG Marketing Department Database</h2>
          <p class="text-sm text-slate-500 text-center mt-1">Sign in to your account</p>
        </div>

        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
            </div>
            <input type="text" id="username" name="username" required
              class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-all outline-none placeholder:text-slate-400"
              placeholder="Enter your username" autofocus>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input type="password" id="password" name="password" required
              class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-all outline-none placeholder:text-slate-400"
              placeholder="••••••••">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-sm hover:bg-slate-800 focus:ring-4 focus:ring-slate-900/20 transition-all active:scale-[0.98] shadow-lg shadow-slate-900/20">
          Sign in to account
        </button>
      </form>
    </div>

    <!-- PWA install (fixed top-right, like the reference system) -->
    <button type="button" class="pwa-install-btn fixed right-4 top-4 z-20 inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-800 shadow-lg shadow-slate-200/60 transition-colors hover:bg-slate-50">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"></path>
        <path d="m7 10 5 5 5-5"></path>
        <path d="M5 21h14"></path>
      </svg>
      <span>Install App</span>
    </button>

    <p class="text-center mt-8 text-slate-500 text-sm">
      HYG Marketing Department Database &middot; All brand resources in one place
    </p>
  </div>

  <!-- Flash Messages as Toast Notifications -->
  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 max-w-sm"></div>
  <script>
    window.toast = {
      show: function (message, category) {
        var colors = { success: 'bg-emerald-600', error: 'bg-red-600', danger: 'bg-red-600', info: 'bg-indigo-600', warning: 'bg-amber-600' };
        var container = document.getElementById('toast-container');
        var item = document.createElement('div');
        item.className = 'toast-item flex items-start gap-2 text-white text-sm font-medium rounded-2xl px-4 py-3 shadow-2xl ' + (colors[category] || 'bg-slate-700');
        item.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        var span = document.createElement('span');
        span.textContent = message;
        item.appendChild(span);
        container.appendChild(item);
        setTimeout(function () {
          item.style.opacity = '0';
          item.style.transform = 'translateY(-8px)';
          setTimeout(function () { item.remove(); }, 300);
        }, 4000);
      }
    };
    document.addEventListener('DOMContentLoaded', function () {
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            window.toast.show({{ message|tojson }}, {{ category|tojson }});
          {% endfor %}
        {% endif %}
      {% endwith %}
    });
  </script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}?v=pwa-1"></script>
</body>
</html>
